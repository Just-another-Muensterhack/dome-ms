{% autoescape off %}# Generated by `manage.py sync_nginx`, changes are overwritten.
# {{ description }}
server {
    listen 80;
    listen [::]:80;
    server_name {{ server_name }};
{% if root %}
    root "{{ root }}";
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    # a website is a single page
    location = / {
        default_type text/html;
        try_files /index.html =404;
    }
{% endif %}
    location / {
        return 404;
    }
}
{% endautoescape %}

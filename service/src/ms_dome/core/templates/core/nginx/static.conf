{% autoescape off %}# Generated by `manage.py sync_nginx`, changes are overwritten.
# {{ description }}
server {
    listen 80;
    listen [::]:80;
    server_name {{ server_name }};
{% if root %}
    root "{{ root }}";
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    # every file of the version's directory is served, `index.html` of a directory for its path
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
{% else %}
    location / {
        return 404;
    }
{% endif %}
}
{% endautoescape %}

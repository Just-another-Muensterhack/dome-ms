<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonnenhof — Kontakt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Sonnenhof</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menü</button>
    <nav id="site-nav" class="site-nav">
      <a href="index.html">Start</a>
      <a href="about.html">Über uns</a>
      <a href="contact.html" aria-current="page">Kontakt</a>
    </nav>
  </header>
  <main>
    <section class="page">
      <p class="kicker">Kontakt</p>
      <h1>Schreib uns, oder komm vorbei.</h1>
      <p class="lead">Der Garten liegt am Sonnenhofweg 4 in Münster. Das Tor ist samstags offen.</p>
      <form class="contact-form" action="#nachricht" method="post">
        <label>
          Name
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <label>
          Nachricht
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button class="button" type="submit">Nachricht vormerken</button>
        <p class="form-note" hidden>Die Nachricht bleibt in diesem Beispiel nur in deinem Browser.</p>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <p>Sonnenhof e. V. · Beispielseite</p>
  </footer>
  <script src="site.js"></script>
</body>
</html>

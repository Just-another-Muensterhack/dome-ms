[project]
name = "site-generator"
version = "0.1.0"
description = "KI-Website-Generator: Fragebogen rein, fertige statische Website raus"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "anthropic>=0.60",
  "httpx>=0.27",
  "nh3>=0.2.18",
  "pillow>=11",
  "python-multipart>=0.0.18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
